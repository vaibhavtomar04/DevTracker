<table th:fragment="header" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0F172A;">
  <tr>
    <td style="padding:24px 32px 20px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0">
        <tr>
          <td style="padding-right:14px;vertical-align:middle;">
            <!-- Application Logo (served from externalized logo URL) -->
            <img th:src="${brand.logoUrl}" width="40" height="40"
                 th:alt="${brand.appName}" style="display:block;border-radius:8px;"/>
          </td>
          <td style="vertical-align:middle;">
            <p class="h1" style="margin:0;color:#FFFFFF;font-size:20px;font-weight:700;font-family:'Segoe UI',Arial,Helvetica,sans-serif;" th:text="${brand.appName}">DevTrack 2.0</p>
            <p style="margin:3px 0 0;color:#94A3B8;font-size:13px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;"
               th:text="${brand.tagline}">Enterprise Engineering Workflow Platform</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="height:3px;background-color:#0F766E;font-size:0;line-height:0;">&nbsp;</td>
  </tr>
</table>
