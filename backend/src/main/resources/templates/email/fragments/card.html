<div th:fragment="infoCard(rows)" class="infocard" th:if="${rows != null and !rows.isEmpty()}"
     style="background-color:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:8px 24px;margin:20px 0;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr class="row" th:each="r : ${rows}">
      <td class="label" style="color:#64748B;font-size:13px;padding:10px 0;border-bottom:1px solid #E2E8F0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;vertical-align:top;" th:text="${r.label}">Label</td>
      <td class="value" style="color:#1E293B;font-size:14px;font-weight:600;padding:10px 0;text-align:right;border-bottom:1px solid #E2E8F0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;" th:text="${r.value}">Value</td>
    </tr>
  </table>
</div>
