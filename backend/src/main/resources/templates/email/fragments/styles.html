<th:block th:fragment="styles">
<style>
  body{margin:0;padding:0;background-color:#F8FAFC;font-family:'Segoe UI',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;}
  table{border-collapse:collapse;}
  img{border:0;line-height:100%;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;}
  a{color:#0F766E;}
  .wrap{width:100%;background-color:#F8FAFC;padding:24px 0;}
  .container{max-width:600px;margin:0 auto;background-color:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;}
  .px{padding-left:32px;padding-right:32px;}
  .h1{color:#FFFFFF;font-size:20px;font-weight:700;margin:0;}
  .muted{color:#64748B;font-size:14px;line-height:22px;}
  .text{color:#1E293B;font-size:15px;line-height:24px;}
  .banner{padding:16px 32px;font-size:15px;font-weight:600;color:#FFFFFF;}
  .infocard{background-color:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:8px 24px;margin:20px 0;}
  .row .label{color:#64748B;font-size:13px;width:42%;padding:8px 0;}
  .row .value{color:#1E293B;font-size:14px;font-weight:600;padding:8px 0;}
  .btn{display:inline-block;background-color:#0F766E;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:15px;padding:13px 28px;border-radius:8px;}
  .timeline span{color:#64748B;font-size:13px;}
  .timeline .done{color:#16A34A;font-weight:bold;}
  .notice{background-color:#FEF9C3;border:1px solid #FDE68A;border-radius:8px;padding:14px 18px;color:#713F12;font-size:13px;margin-top:20px;}
  .footer{color:#64748B;font-size:12px;line-height:20px;text-align:center;padding:24px 32px;border-top:1px solid #E2E8F0;background-color:#F1F5F9;}
  @media (max-width:620px){
    .container{border-radius:0!important;}
    .px,.banner,.footer{padding-left:20px!important;padding-right:20px!important;}
    .row .label,.row .value{display:block!important;width:100%!important;}
  }
</style>
</th:block>
